# Staged build config for the SELF-CONTAINED pyramidElevatorDist wheel.
#
# This file is NOT built from directly. `packaging/build_wheel.py` copies it into
# the staging dir (build/pkg/), injects the version, and runs `python -m build`
# there against a package that already contains the vendored `pyramidElevatorDist/_impl/`.
# The `__VERSION__` sentinel is replaced with `pyramidElevatorDist.__version__`.
[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyramidElevatorDist"
version = "__VERSION__"
description = "Estimate elevator vertical travel from phone accelerometer signals."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "pydantic>=2.0",
    "matplotlib>=3.7",
]

# Ship only the façade package and its vendored `_impl/` subtree — nothing else.
[tool.setuptools.packages.find]
where = ["."]
include = ["pyramidElevatorDist*"]

# The detector/predictor configs and per-algorithm conformal calibrations are read
# at runtime via `Path(__file__).with_name(...)`, so they must travel in the wheel.
[tool.setuptools.package-data]
"*" = ["*.json"]
